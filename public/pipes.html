<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>小兔接水管</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --s: min(22vw, 15vh, 110px); --gap: 6px; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #5a3b3b; font-family: system-ui, sans-serif; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 16px; user-select: none; -webkit-user-select: none; }
  header { display: flex; gap: 12px; align-items: center; font-size: 20px; }
  button { font: inherit; font-size: 18px; border: 0; border-radius: 12px; padding: 8px 16px; background: #ffb6d2; color: #5a3b3b; cursor: pointer; }
  .board { background: #cfeb72; border-radius: 22px; padding: 4px 20px; box-shadow: 0 6px 0 #6f8a2a;
    display: grid; grid-template-columns: repeat(3, var(--s)); gap: var(--gap); }
  .end { height: calc(var(--s) * .6); display: flex; justify-content: center; align-items: center; font-size: calc(var(--s) * .5); }
  .end.on { filter: drop-shadow(0 0 6px #ff0); }
  .won .end.exit { animation: hop .5s infinite alternate; }
  @keyframes hop { to { transform: translateY(-8px) scale(1.1); } }
  .cell { width: var(--s); height: var(--s); border-radius: 10px; background: #edb07f; }
  .tray { display: grid; grid-template-columns: repeat(3, var(--s)); gap: 12px; }
  .slot { width: var(--s); height: var(--s); border-radius: 12px; background: rgba(0,0,0,.15); }
  .tile { width: 100%; height: 100%; border-radius: 12px; background: #ffc6dd; box-shadow: inset 0 0 0 5px #ffaacc;
    touch-action: none; cursor: grab; position: relative; }
  .tile.dragging { z-index: 10; cursor: grabbing; opacity: .85; }
  .tile svg { width: 100%; height: 100%; transition: transform .2s; }
  .tile path { stroke: #7fc8ef; }
  .tile.wet path { stroke: #0090e0; }
  .msg { min-height: 1.6em; font-size: 22px; }
</style>
</head>
<body>
<header><span>🐰 接水管 · 第 <b id="lv">1</b> 关</span><button id="reset">重来</button><button id="next">换一关</button></header>
<div class="board" id="board"></div>
<div class="msg" id="msg">把水管拖到格子里，点一下可以转动</div>
<div class="tray" id="tray"></div>
<script type="module">
import { rotate, flow, makeLevel } from './pipes.js';

const $ = id => document.getElementById(id);
const ARMS = { 1: 'M50 50V0', 2: 'M50 50H100', 4: 'M50 50V100', 8: 'M50 50H0' };
let level, pieces, els, levelNo = 1, won = false;

function tileEl(p) {
  const el = document.createElement('div');
  el.className = 'tile';
  const d = [1, 2, 4, 8].filter(b => p.mask & b).map(b => ARMS[b]).join('');
  el.innerHTML = `<svg viewBox="0 0 100 100"><path d="${d}" fill="none" stroke-width="16" stroke-linecap="square"/></svg>`;
  el.querySelector('svg').style.transform = `rotate(${p.rot * 90}deg)`;
  drag(el, p);
  return el;
}

function start(fresh) {
  if (fresh) level = makeLevel();
  pieces = level.pieces.map(p => ({ ...p }));
  won = false;
  document.body.classList.remove('won');
  $('lv').textContent = levelNo;
  $('msg').textContent = '把水管拖到格子里，点一下可以转动';
  const ends = row => [0, 1, 2].map(c => `<div class="end ${row}">${c === level[row] ? (row === 'exit' ? '🍄' : '🐰') : ''}</div>`).join('');
  $('board').innerHTML = ends('exit') + Array.from({ length: 9 }, (_, k) => `<div class="cell" data-k="${k}"></div>`).join('') + ends('entry');
  $('tray').innerHTML = pieces.map(() => '<div class="slot"></div>').join('');
  els = pieces.map(tileEl);
  render();
}

function render() {
  const cells = document.querySelectorAll('.cell'), slots = document.querySelectorAll('.slot');
  pieces.forEach((p, i) => (p.cell === null ? slots[i] : cells[p.cell]).appendChild(els[i]));
  const grid = Array(9).fill(0);
  pieces.forEach(p => { if (p.cell !== null) grid[p.cell] = rotate(p.mask, p.rot); });
  const res = flow(grid, level.entry, level.exit);
  pieces.forEach((p, i) => els[i].classList.toggle('wet', p.cell !== null && res.wet.has(p.cell)));
  document.querySelector('.end.exit:not(:empty)').classList.toggle('on', res.won);
  if (res.won && !won) {
    won = true;
    document.body.classList.add('won');
    $('msg').textContent = '🎉 水流到蘑菇啦！真棒！';
    setTimeout(() => { levelNo++; start(true); }, 2200);
  }
}

// Tap = rotate clockwise; drag = move to an empty cell (anywhere else returns it to the tray).
function drag(el, p) {
  let s = null;
  el.addEventListener('pointerdown', e => {
    if (won) return;
    s = { x: e.clientX, y: e.clientY, moved: false };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.moved && Math.hypot(dx, dy) < 8) return;
    s.moved = true;
    el.classList.add('dragging');
    el.style.translate = `${dx}px ${dy}px`;
  });
  const end = e => {
    if (!s) return;
    const moved = s.moved;
    s = null;
    el.classList.remove('dragging');
    el.style.translate = '';
    if (!moved) {
      p.rot++;
      el.querySelector('svg').style.transform = `rotate(${p.rot * 90}deg)`;
    } else {
      const cell = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList.contains('cell'));
      const k = cell ? +cell.dataset.k : null;
      p.cell = k !== null && !pieces.some(q => q !== p && q.cell === k) ? k : null;
    }
    render();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

$('reset').onclick = () => start(false);
$('next').onclick = () => { levelNo++; start(true); };
start(true);
</script>
</body>
</html>
